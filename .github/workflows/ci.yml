name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:smoke

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: bash scripts/smoke-test.sh
      - run: bash -n server/native-ssh-session.sh scripts/*.sh

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
        working-directory: desktop

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: node scripts/desktop-smoke.js
      - run: npm run build:windows
      - run: node scripts/desktop-smoke.js "${{ github.workspace }}/dist/windows/win-unpacked/TAKT-UI-CC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-11-x64
          path: dist/windows/*.exe
